<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anime Streaming - Watch Free Anime</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎬</text></svg>">
    <script>
        // Redirect to index.html with the path as a query parameter
        // This enables SPA-style routing on GitHub Pages
        const path = window.location.pathname;
        const search = window.location.search;
        const hash = window.location.hash;
        window.location.replace('/' + (search ? search + '&' : '?') + 'p=' + encodeURIComponent(path) + hash);
    </script>
</head>
<body>
    <noscript>
        <meta http-equiv="refresh" content="0; url=/">
    </noscript>
</body>
</html>
